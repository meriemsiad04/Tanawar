<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TANAWAR</title>
    <!-- Apply the saved / system theme, font size and reduced animations before first paint (see src/services/appearance.js). -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) root.classList.add("dark");
          var f = localStorage.getItem("fontSize");
          if (f === "small" || f === "large") root.setAttribute("data-font-size", f);
          if (localStorage.getItem("reduceMotion") === "1") root.setAttribute("data-reduce-motion", "");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans:wght@400;600;700;800&family=Noto+Serif:wght@700&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
